<!DOCTYPE html>
<html lang="de">

<head>
  <!-- The page the browser test drives. It is an ordinary FTUI page: the
       framework is loaded the way index.html loads it, and the component is
       used the way the README says to use it. -->
  <base href="../" />
  <script src="ftui.js"></script>
  <link href="ftui.css" rel="stylesheet">
  <link href="themes/ftui-theme.css" rel="stylesheet">

  <meta name="viewport" content="width=device-width">
  <meta name="fhemweb_url" content="fhem">
  <meta name="debug" content="0">
  <meta name="toast" content="0">
  <!-- The first full read of the readings is due 20 s + this after start. -->
  <meta name="refresh_restart_delay" content="-19">
  <meta name="refresh_interval" content="2">

  <title>ftui-neato-map</title>
</head>

<body>
  <!-- No base-width: the tiles divide up the window, and follow it when it
       changes size. -->
  <ftui-grid resize margin="8" shape="round">

    <!-- Everything from FHEM: the sessions are listed by the device, the
         current one and the state come from its readings. -->
    <ftui-grid-tile id="bound" row="1" col="1" width="4" height="4">
      <ftui-grid-header>Staubsauger</ftui-grid-header>
      <ftui-neato-map id="map-bound"
                      device="Staubsauger"
                      [track-file]="Staubsauger:trackFile"
                      [state]="Staubsauger:state"></ftui-neato-map>
    </ftui-grid-tile>

    <!-- A fixed list, no FHEM command involved. -->
    <ftui-grid-tile id="listed" row="1" col="5" width="4" height="4">
      <ftui-grid-header>Feste Liste</ftui-grid-header>
      <ftui-neato-map id="map-listed"
                      files="Staubsauger-2026-09-20_11-59-11.jsonl,Staubsauger-2026-09-19_09-30-00.jsonl,Staubsauger-2026-09-18_14-05-00.jsonl"></ftui-neato-map>
    </ftui-grid-tile>

    <!-- Die Waende als Gitterzellen statt als Linien: die rohe Evidenz. -->
    <ftui-grid-tile id="celled" row="5" col="7" width="2" height="2">
      <ftui-grid-header>Zellen</ftui-grid-header>
      <ftui-neato-map id="map-celled" walls="cells" show-info="false"
                      file="Staubsauger-2026-09-20_11-59-11.jsonl"></ftui-neato-map>
    </ftui-grid-tile>

    <!-- Eigene Farben, damit der Screenshot zeigt, was die Attribute tun. -->
    <ftui-grid-tile id="painted" row="5" col="4" width="3" height="2">
      <ftui-neato-map id="map-painted"
                      wall-color="danger" track-color="#7fd3ff"
                      free-color="rgb(120, 140, 160)" free-opacity="0.25"
                      show-info="false"
                      file="Staubsauger-2026-09-20_11-59-11.jsonl"></ftui-neato-map>
    </ftui-grid-tile>

    <!-- Der ausgelassene Boden und die Stelle, an der er stehenblieb. Der
         Raum ist erfunden (tools/make-room-fixture.mjs), aber dicht
         aufgezeichnet - die anderen Dateien hier sind ausgeduennt. -->
    <ftui-grid-tile id="room" row="7" col="1" width="3" height="3">
      <ftui-grid-header>Testraum</ftui-grid-header>
      <ftui-neato-map id="map-room" show-missed="true" show-controls="false"
                      file="Testraum-2026-01-02_09-00-00.jsonl"></ftui-neato-map>
    </ftui-grid-tile>

    <!-- The raw endpoints instead of the grid, in a tile of another shape. -->
    <ftui-grid-tile id="points" row="5" col="1" width="3" height="2">
      <ftui-neato-map id="map-points" show-points show-info="false"
                      file="Staubsauger-2026-09-20_11-59-11.jsonl"></ftui-neato-map>
    </ftui-grid-tile>

  </ftui-grid>

  <!-- In einem Popup, wie es auf einer Tafel per Knopfdruck aufgeht: eigene
       Groessen fuer Zeile und Pfeile, timeout=0 damit es offen bleibt. -->
  <!-- Nicht active: sonst liegt das Overlay ueber der Seite und die anderen
       Kacheln sind nicht mehr anklickbar. Der Test oeffnet es selbst. -->
  <ftui-popup id="popup" width="50%" height="60%" timeout="0" shape="round">
    <ftui-popup-header>Staubsauger</ftui-popup-header>
    <ftui-neato-map id="map-popup"
                    text-size="1.4" arrow-size="3"
                    files="Staubsauger-2026-09-20_11-59-11.jsonl,Staubsauger-2026-09-19_09-30-00.jsonl"></ftui-neato-map>
  </ftui-popup>
</body>

</html>
