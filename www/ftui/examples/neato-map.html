<!DOCTYPE html>
<html lang="de">

<head>
  <!--
    Beispielseite für <ftui-neato-map>.

    Nach www/ftui/examples/ des FTUI-Verzeichnisses kopieren und im Browser
    öffnen: <FHEM>/fhem/ftui/examples/neato-map.html
    "Staubsauger" überall durch den Namen des eigenen NeatoLocal-Geräts
    ersetzen.
    -->
  <base href="../" />
  <script src="ftui.js"></script>
  <link href="ftui.css" rel="stylesheet">
  <link href="themes/ftui-theme.css" rel="stylesheet">
  <link href="favicon.ico" rel="icon" type="image/x-icon" />

  <meta name="viewport" content="width=device-width">
  <meta name="debug" content="0">

  <title>Neato – Reinigungskarten</title>
</head>

<body>
  <ftui-grid margin="8" shape="round">

    <!-- Der Normalfall: das Gerät nennen, die beiden Readings binden.
         Die Karte füllt die Kachel, die Läufe sind durchblätterbar. -->
    <ftui-grid-tile row="1" col="1" width="6" height="5">
      <ftui-grid-header>Staubsauger</ftui-grid-header>
      <ftui-neato-map device="Staubsauger"
                      [track-file]="Staubsauger:trackFile"
                      [state]="Staubsauger:state"></ftui-neato-map>
    </ftui-grid-tile>

    <!-- Nur der letzte Lauf, ohne Blättern und ohne Zeile darunter. -->
    <ftui-grid-tile row="1" col="7" width="3" height="3">
      <ftui-grid-header>Zuletzt</ftui-grid-header>
      <ftui-neato-map device="Staubsauger"
                      [track-file]="Staubsauger:trackFile"
                      [state]="Staubsauger:state"
                      limit="1" show-info="false" show-controls="false"></ftui-neato-map>
    </ftui-grid-tile>

    <!-- Oeffnet das Popup weiter unten. -->
    <ftui-grid-tile row="6" col="1" width="2" height="1">
      <ftui-icon name="expand" size="2" @click="neatoPopup.open()"></ftui-icon>
      <ftui-label>Karte gross</ftui-label>
    </ftui-grid-tile>

    <!-- Die rohen Endpunkte statt des Belegungsgitters, in eigenen Farben.
         Farbnamen wie 'info' sind die des FTUI-Themas, daneben geht jede
         CSS-Farbe. -->
    <ftui-grid-tile row="4" col="7" width="3" height="2">
      <ftui-grid-header>Punkte</ftui-grid-header>
      <ftui-neato-map device="Staubsauger"
                      [track-file]="Staubsauger:trackFile"
                      show-points show-track="false"
                      point-color="info"></ftui-neato-map>
    </ftui-grid-tile>


    <!-- Der gemeinsame Grundriss aus mehreren Laeufen. Das Modul rechnet ihn
         ab v0.20.0 selbst ("set Staubsauger buildPlan", oder
         "attr Staubsauger planAuto 1") und nennt die Datei im Reading
         planFile - hier wird nur noch gezeichnet. Ohne das Modul laesst man
         plan-file weg, dann rechnet die Komponente selbst aus den neuesten
         vier Laeufen; das kostet auf einem Tablet ein paar Sekunden. -->
    <ftui-grid-tile row="6" col="1" width="6" height="5">
      <ftui-grid-header>Grundriss</ftui-grid-header>
      <ftui-neato-map device="Staubsauger" view="plan"
                      [plan-file]="Staubsauger:planFile"></ftui-neato-map>
    </ftui-grid-tile>

  </ftui-grid>

  <!-- Dieselbe Karte in einem Popup. In der Kachelschrift wird die Zeile dort
       schnell zu klein, darum groessere Schrift und groessere Pfeile. -->
  <ftui-popup id="neatoPopup" width="60%" height="70%" timeout="0" shape="round">
    <ftui-popup-header>Staubsauger</ftui-popup-header>
    <ftui-neato-map device="Staubsauger"
                    [track-file]="Staubsauger:trackFile"
                    [state]="Staubsauger:state"
                    text-size="1.4" arrow-size="3"></ftui-neato-map>
  </ftui-popup>
</body>

</html>
